# Публикует макеты вишлиста на GitHub Pages.
# Статика без сборки: содержимое репозитория выкладывается как есть.
# Корень сайта — прототип (index.html), презентация — /presentation/.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно — только один деплой; новый push отменяет незавершённый.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          # всё, кроме служебных папок
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/
          # иначе Pages прогоняет всё через Jekyll и выкидывает пути с подчёркиванием
          touch _site/.nojekyll

      # Имена файлов постоянные, поэтому браузер держит их в кэше и после деплоя
      # показывает старую сборку. Метка версии в ссылке снимает вопрос.
      - name: Stamp assets with the commit sha
        run: python3 .github/cache-bust.py _site "${GITHUB_SHA::8}"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
